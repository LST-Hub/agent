name: Timesheet Monitoring Agents
 
on:
  schedule:
    # Daily Agent - Runs every day at 9 PM IST (3:30 PM UTC)
    - cron: '30 15 * * *'
    # Weekly Agent - Wednesday at 6 PM IST (12:30 PM UTC)
    - cron: '30 12 * * 3'
    # Weekly Agent - Friday at 6 PM IST (12:30 PM UTC)
    - cron: '30 12 * * 5'
    # Weekly Report Agent - Monday at 9 PM IST (3:30 PM UTC)
    - cron: '30 15 * * 1'
 
  # Allow manual triggering for testing
  workflow_dispatch:
    inputs:
      agent_type:
        description: 'Agent to run'
        required: true
        type: choice
        options:
          - daily
          - weekly
          - weekly-report
 
jobs:
  run-agents:
    runs-on: ubuntu-latest
   
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
     
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
     
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .
     
      - name: Determine which agent to run
        id: determine-agent
        run: |
          # Get current day of week (0=Sun, 1=Mon, ... 6=Sat)
          DAY=$(date -u +%u)
          # Get current hour in UTC
          HOUR=$(date -u +%H)
         
          # Manual trigger takes precedence
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "agent=${{ github.event.inputs.agent_type }}" >> $GITHUB_OUTPUT
          # Monday 15:30 UTC = Weekly Report
          elif [ "$DAY" == "1" ] && [ "$HOUR" == "15" ]; then
            echo "agent=weekly-report" >> $GITHUB_OUTPUT
          # Wednesday 12:30 UTC or Friday 12:30 UTC = Weekly
          elif [ "$DAY" == "3" ] && [ "$HOUR" == "12" ]; then
            echo "agent=weekly" >> $GITHUB_OUTPUT
          elif [ "$DAY" == "5" ] && [ "$HOUR" == "12" ]; then
            echo "agent=weekly" >> $GITHUB_OUTPUT
          # Daily at 15:30 UTC
          elif [ "$HOUR" == "15" ]; then
            echo "agent=daily" >> $GITHUB_OUTPUT
          else
            echo "agent=daily" >> $GITHUB_OUTPUT
          fi
     
      - name: Run Daily Agent
        if: steps.determine-agent.outputs.agent == 'daily'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          EMAIL_HOST: ${{ secrets.EMAIL_HOST }}
          EMAIL_PORT: ${{ secrets.EMAIL_PORT }}
          EMAIL_USERNAME: ${{ secrets.EMAIL_USERNAME }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          PM_EMAIL: ${{ secrets.PM_EMAIL }}
          IGNORE_IDS: ${{ secrets.IGNORE_IDS }}
        run: |
          echo "Running Daily Agent..."
          python main.py daily
     
      - name: Run Weekly Agent
        if: steps.determine-agent.outputs.agent == 'weekly'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          EMAIL_HOST: ${{ secrets.EMAIL_HOST }}
          EMAIL_PORT: ${{ secrets.EMAIL_PORT }}
          EMAIL_USERNAME: ${{ secrets.EMAIL_USERNAME }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          PM_EMAIL: ${{ secrets.PM_EMAIL }}
          IGNORE_IDS: ${{ secrets.IGNORE_IDS }}
        run: |
          echo "Running Weekly Agent..."
          python main.py weekly
     
      - name: Run Weekly Report Agent
        if: steps.determine-agent.outputs.agent == 'weekly-report'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          EMAIL_HOST: ${{ secrets.EMAIL_HOST }}
          EMAIL_PORT: ${{ secrets.EMAIL_PORT }}
          EMAIL_USERNAME: ${{ secrets.EMAIL_USERNAME }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          PM_EMAIL: ${{ secrets.PM_EMAIL }}
          IGNORE_IDS: ${{ secrets.IGNORE_IDS }}
          SHAREPOINT_SITE_URL: ${{ secrets.SHAREPOINT_SITE_URL }}
          SHAREPOINT_CLIENT_ID: ${{ secrets.SHAREPOINT_CLIENT_ID }}
          SHAREPOINT_CLIENT_SECRET: ${{ secrets.SHAREPOINT_CLIENT_SECRET }}
        run: |
          echo "Running Weekly Report Agent..."
          python main.py weekly-report
     
      - name: Notify on failure
        if: failure()
        run: |
          echo "Agent execution failed! Check the logs."
          # You can add additional notification logic here