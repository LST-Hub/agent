services:
  - type: cron
    name: timesheet-master-agent
    env: python
    runtime: python-3.11
    schedule: "*/5 * * * *"  # Runs every 5 minutes
    buildCommand: "pip install ."
    startCommand: "python scheduler.py"
    envVars:
      # Email Configuration
      - key: EMAIL_SERVICE
        sync: false
      - key: EMAIL_SERVER_HOST
        sync: false
      - key: EMAIL_SERVER_PORT
        sync: false
      - key: EMAIL_SERVER_SECURE
        sync: false
      - key: EMAIL_SERVER_USER
        sync: false
      - key: EMAIL_SERVER_PASSWORD
        sync: false
      - key: EMAIL_FROM
        sync: false

      # Agent Configuration
      - key: LOG_LEVEL
        sync: false
      - key: IGNORE_ID
        sync: false
      - key: PM_EMAIL
        sync: false

      # SharePoint / Microsoft Configuration
      - key: TENANT_ID
        sync: false
      - key: CLIENT_ID
        sync: false
      - key: CLIENT_SECRET
        sync: false
      - key: FILE_NAME
        sync: false
      - key: TABLE_NAME
        sync: false
      - key: SITE_ID
        sync: false
      - key: DRIVE_ID
        sync: false