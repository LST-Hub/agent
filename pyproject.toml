[project]
name = "agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mysql-connector-python>=9.5.0",
    "pydantic>=2.0.0",
    "sqlalchemy>=2.0.0",
    "schedule>=1.2.0",
    "python-dotenv>=1.0.0",
    "openai>=1.0.0",
    "psycopg2-binary>=2.9.0",
    "pymysql",
    "requests>=2.32.5",
    "pandas>=3.0.0",
    "pydantic-settings>=2.12.0",
    "openpyxl>=3.1.5",
    "cryptography>=50.0.2",
    "fastmcp>=2.13,<3",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent*", "agents*", "models*", "services*", "database*", "config*", "scheduler*", "utils*", "data*"]
exclude = ["tests*", "docs*"]
